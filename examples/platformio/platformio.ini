; Ducta on a microcontroller: nodes created from a JSON configuration, run every 10 ms.
;
;   pio run -e nucleo_f446re -t upload && pio device monitor    (or esp32dev, nodemcuv2, uno_r4_minima)
;   pio run -e native && .pio/build/native/program
;
; The CI builds every environment (.github/workflows/ci.yml).
;
; In your own project replace "symlink://../.." by the repository and a release tag:
;   lib_deps = https://github.com/serhiimykhailovengineer/ducta.git#v0.1.0

[env]
lib_deps =
    symlink://../..
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    ; include/ducta_config.hpp configures Ducta: it must be visible to every file that
    ; includes Ducta, the libraries too
    -I include

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ESP8266 (NodeMCU v2): 80 KB of RAM, which also holds the constant data (strings, tables).
; delay() in the sleep between frames lets the Wi-Fi stack run and feeds the watchdog
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; Arduino UNO R4 Minima: Renesas RA4M1, 32 KB of RAM
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200

; The same program on the computer: the platform hooks of the embedded backend come from Ducta
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DDUCTA_USE_HOST_PLATFORM
